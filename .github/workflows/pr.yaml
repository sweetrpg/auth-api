name: PR Validation

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write

jobs:
  validate:
    uses: sweetrpg/github-actions/.github/workflows/go-ci.yaml@master
    with:
      publish-coverage: false
      mongodb-version: "8.0"
      # GOFLAGS=-v lists each test in the log, so a package that ran nothing is visible.
      test-env: '{"DB_URI": "mongodb://localhost:27017/auth-api-ci", "GOFLAGS": "-v"}'
    secrets: inherit

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=auth-api-linux-amd64
