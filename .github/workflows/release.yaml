name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: sweetrpg/github-actions/.github/workflows/swift-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      # PR/CI validation doesn't need this override, but the release workflow's clean,
      # full-history resolution (fetch-depth: 0, fetch-tags: true) pulls in swift-log/swift-nio
      # releases requiring a newer swift-tools-version than this reusable workflow's "6.0"
      # default toolchain - same failure mode admin-web/auth-web hit on their v0.1.0 releases.
      swift-version: "6.2"
    secrets: inherit
