name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: sweetrpg/github-actions/.github/workflows/go-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      mongodb-version: "8.0"
      # GOFLAGS=-v lists each test in the log, so a package that ran nothing is visible.
      test-env: '{"DB_URI": "mongodb://localhost:27017/auth-api-ci", "GOFLAGS": "-v"}'
    secrets: inherit
