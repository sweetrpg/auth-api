---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: auth-api-nats

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-nats
    creationPolicy: Owner
  data:
    # NATS user auth-api (flux configs/nats). Same Akeyless value the NATS broker reads.
    - secretKey: NATS_PASSWORD
      remoteRef:
        key: /sweetrpg/auth/api/nats/auth
        property: password
