# OpenFGA authorization server for auth-api (evaluate-openfga-authorization, dev). The migrate
# init container applies datastore migrations before the server starts. Only auth-api calls it,
# over in-cluster DNS. Selectors use com.sweetrpg/workload; this file sits outside app/ so the
# auth-api labels never reach its pod template (they would match the api-v1 Service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      com.sweetrpg/workload: openfga
  template:
    metadata:
      labels:
        com.sweetrpg/workload: openfga
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: openfga/openfga:v1.22.1
          args: ["migrate", "--datastore-engine", "postgres"]
          env:
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: openfga-datastore
                  key: OPENFGA_DATASTORE_URI
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: openfga
          image: openfga/openfga:v1.22.1
          args: ["run"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: openfga-datastore
                  key: OPENFGA_DATASTORE_URI
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
            - name: OPENFGA_LOG_FORMAT
              value: json
            # Preshared-key authentication (PADR-0040). /healthz stays unauthenticated, so the probes
            # below need no header. The Secret is not optional: a missing key must block the rollout, not
            # start a server that rejects every caller. To roll back, remove these two variables.
            - name: OPENFGA_AUTHN_METHOD
              value: preshared
            - name: OPENFGA_AUTHN_PRESHARED_KEYS
              valueFrom:
                secretKeyRef:
                  name: api-openfga
                  key: OPENFGA_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
spec:
  selector:
    com.sweetrpg/workload: openfga
  ports:
    - name: http
      port: 8080
      targetPort: http
