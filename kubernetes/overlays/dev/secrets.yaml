---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        # Must have a key named DATABASE_URL (a MongoDB connection string) - see configure.swift.
        - extract:
              key: /sweetrpg/auth/api/db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    data:
        # Same shared Auth0 application auth-web registers - AUTH0_DOMAIN/AUTH0_AUDIENCE only
        # (this service verifies tokens, it never originates the Authorization Code flow, so it
        # has no use for AUTH0_CLIENT_ID/AUTH0_CLIENT_SECRET).
        - secretKey: AUTH0_DOMAIN
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_DOMAIN
        - secretKey: AUTH0_AUDIENCE
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_AUDIENCE
    dataFrom:
        # Must be the exact same value as admin-web's AUTH_API_INTERNAL_SERVICE_TOKEN (see
        # sweetrpg/admin-web's kubernetes/overlays/dev/secrets.yaml and this repo's
        # Sources/App/Services/InternalServiceAuth.swift) - a rotated value distinct from
        # users-api's old INTERNAL_SERVICE_TOKEN (see split-authz-into-auth-api's design.md's
        # "X-Internal-Service-Token trust boundary moves to a new service" risk). Rewrite maps
        # the Akeyless key admin-web reads as AUTH_API_INTERNAL_SERVICE_TOKEN onto the env var
        # name this app reads, INTERNAL_SERVICE_TOKEN, so both sides pull from one shared secret
        # value instead of two that could drift apart.
        - extract:
              key: /sweetrpg/admin/web/auth-api
          rewrite:
              - regexp:
                    source: "AUTH_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"
