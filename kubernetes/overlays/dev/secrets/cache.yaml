---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-api-cache

spec:
    refreshInterval: 12h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-cache
        creationPolicy: Owner
    dataFrom:
        # Provides REDIS_PASS for the api-core.go/ratelimit Redis pool (Valkey ACL auth is on in
        # every namespace). Mirrors catalog-api's secrets/cache.yaml. See platform #106.
        - extract:
              key: /sweetrpg/auth/cache/auth
