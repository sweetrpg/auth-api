---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        # Must have a key named DATABASE_URL (a MongoDB connection string) - see configure.swift.
        - extract:
              key: /sweetrpg/auth/api/db
