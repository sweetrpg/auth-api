---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-api-misc

spec:
    refreshInterval: 12h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    data:
        # Same shared Auth0 application auth-web registers - AUTH0_DOMAIN/AUTH0_AUDIENCE only
        # (this service verifies tokens, it never originates the Authorization Code flow, so it
        # has no use for AUTH0_CLIENT_ID/AUTH0_CLIENT_SECRET).
        - secretKey: AUTH0_DOMAIN
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_DOMAIN
        - secretKey: AUTH0_AUDIENCE
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_AUDIENCE
