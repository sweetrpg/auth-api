---
# Local dev only - points at the shared, no-auth MongoDB in sweetrpg-db instead of the real
# Atlas cluster dev/prod use (see the dev overlay's secrets.yaml). Same pattern as users-api's
# own local overlay.
apiVersion: v1
kind: Secret

metadata:
    name: api-db

type: Opaque
stringData:
    DATABASE_URL: mongodb://mongodb.sweetrpg-db.svc.cluster.local:27017/sweetrpg-auth

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    data:
        - secretKey: AUTH0_DOMAIN
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_DOMAIN
        - secretKey: AUTH0_AUDIENCE
          remoteRef:
              key: /sweetrpg/dev/auth/auth0
              property: AUTH0_AUDIENCE
    dataFrom:
        # Same shared secret admin-web's local overlay reads as AUTH_API_INTERNAL_SERVICE_TOKEN -
        # see the dev overlay's secrets.yaml for the full rationale.
        - extract:
              key: /sweetrpg/admin/web/auth-api
          rewrite:
              - regexp:
                    source: "AUTH_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"
